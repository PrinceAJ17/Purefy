<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smoke Effect on Name</title>
    <div id="overlay" style="display: none"></div>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      video {
        object-fit: cover;
      }

      section {
        background: #000;
      }

      h1 {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        text-align: center;
        letter-spacing: 1rem;
        text-transform: uppercase;
        color: #f5f5f5;
        font-size: 5em;
        font-family: sans-serif;
      }

      h1 span {
        display: inline-block;
        animation: animate 1s ease-in-out;
      }

      /* Existing styles */

      /* Fade out effect */
      .fade-out {
        animation: fadeOut 1s ease forwards;
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @keyframes animate {
        0% {
          opacity: 0;
          transform: rotateY(90deg);
          filter: blur(10px);
        }
        100% {
          opacity: 1;
          transform: rotateY(0deg);
          filter: blur(0px);
        }
      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        opacity: 0;
        transition: opacity 2s ease-in-out;
        z-index: 1000; /* Ensure it's above other content */
      }

      #overlay.fade-in {
        opacity: 1;
        display: block; /* Make it visible */
      }

      h1 span:nth-child(1) {
        animation-delay: 0.6s;
      }
      h1 span:nth-child(2) {
        animation-delay: 1s;
      }
      h1 span:nth-child(3) {
        animation-delay: 1.4s;
      }
      h1 span:nth-child(4) {
        animation-delay: 1.8s;
      }
      h1 span:nth-child(5) {
        animation-delay: 2.2s;
      }
      h1 span:nth-child(6) {
        animation-delay: 2.6s;
      }
    </style>
  </head>
  <body>
    <section>
      <video src="smoke.mp4" autoplay muted loop></video>
      <h1>
        <span>P</span>
        <span>U</span>
        <span>R</span>
        <span>E</span>
        <span>F</span>
        <span>Y</span>
      </h1>
    </section>
  </body>
</html>

<script>
  window.addEventListener('load', function () {
    // Wait for the animation to complete
    setTimeout(function () {
      // Fade in the overlay
      document.getElementById('overlay').classList.add('fade-in');

      // Wait for the fade-in to complete before redirecting
      setTimeout(function () {
        // Redirect to the desired HTML page
        window.location.href = 'myapp.html'; // Change 'nextPage.html' to your desired page
      }, 2000); // This matches the 2s transition duration
    }, 4200); // Adjust based on your animation timing
  });
</script>
