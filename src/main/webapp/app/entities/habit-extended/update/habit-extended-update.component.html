<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-habit-extended-heading" data-cy="HabitExtendedCreateUpdateHeading">Create or edit a Habit Extended</h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_habitExtendedID">Habit Extended ID</label>
          <input
            type="number"
            class="form-control"
            name="habitExtendedID"
            id="field_habitExtendedID"
            data-cy="habitExtendedID"
            formControlName="habitExtendedID"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_habitExtendedName">Habit Extended Name</label>
          <input
            type="text"
            class="form-control"
            name="habitExtendedName"
            id="field_habitExtendedName"
            data-cy="habitExtendedName"
            formControlName="habitExtendedName"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_habitCompletionCheckbox">Habit Completion Checkbox</label>
          <input
            type="checkbox"
            class="form-check"
            name="habitCompletionCheckbox"
            id="field_habitCompletionCheckbox"
            data-cy="habitCompletionCheckbox"
            formControlName="habitCompletionCheckbox"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_habitDate">Habit Date</label>
          <div class="d-flex">
            <input
              id="field_habitDate"
              data-cy="habitDate"
              type="datetime-local"
              class="form-control"
              name="habitDate"
              formControlName="habitDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_rel1">Rel 1</label>
          <select
            class="form-control"
            id="field_rel1"
            data-cy="rel1"
            name="rel1"
            formControlName="rel1"
            [compareWith]="compareNewWeeklyHabitTracker"
          >
            <option [ngValue]="null"></option>
            <option
              [ngValue]="newWeeklyHabitTrackerOption"
              *ngFor="let newWeeklyHabitTrackerOption of newWeeklyHabitTrackersSharedCollection"
            >
              {{ newWeeklyHabitTrackerOption.recordID }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
