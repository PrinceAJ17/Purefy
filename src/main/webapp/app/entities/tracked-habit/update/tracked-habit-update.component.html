<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-tracked-habit-heading" data-cy="TrackedHabitCreateUpdateHeading">Create or edit a Tracked Habit</h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_completed">Completed</label>
          <input type="checkbox" class="form-check" name="completed" id="field_completed" data-cy="completed" formControlName="completed" />
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_trackedHabitID">Tracked Habit ID</label>
          <input
            type="number"
            class="form-control"
            name="trackedHabitID"
            id="field_trackedHabitID"
            data-cy="trackedHabitID"
            formControlName="trackedHabitID"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_rel1">Rel 1</label>
          <select class="form-control" id="field_rel1" data-cy="rel1" name="rel1" formControlName="rel1" [compareWith]="compareHabit">
            <option [ngValue]="null"></option>
            <option [ngValue]="habitOption" *ngFor="let habitOption of habitsSharedCollection">{{ habitOption.habitName }}</option>
          </select>
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_rel2">Rel 2</label>
          <select
            class="form-control"
            id="field_rel2"
            data-cy="rel2"
            name="rel2"
            formControlName="rel2"
            [compareWith]="compareNewWeeklyHabitTracker"
          >
            <option [ngValue]="null"></option>
            <option
              [ngValue]="newWeeklyHabitTrackerOption"
              *ngFor="let newWeeklyHabitTrackerOption of newWeeklyHabitTrackersSharedCollection"
            >
              {{ newWeeklyHabitTrackerOption.recordID }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
